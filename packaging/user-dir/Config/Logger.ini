# Release logging defaults.
#
# History: file logging was deliberately re-enabled after the 2026-09-22
# analytics crash fix so future crashes stay diagnosable, and OSREPORT/
# OSREPORT_HLE stay on so guest panic text is not dark. That intent is kept:
# everything still lands in Logs/dolphin.log, but console/window listeners are
# off (no console spam, no log window) and Verbosity caps the level at WARNING,
# which still passes NOTICE/ERROR/WARNING (OSReport, OSPanic, boot/core
# diagnostics) while dropping INFO/DEBUG chatter.
# Verbosity: 1=NOTICE 2=ERROR 3=WARNING 4=INFO 5=DEBUG (see Common/Logging).
[Logs]
ActionReplay = False
AI = False
AMMB = False
AMMB_NET = False
Audio = False
